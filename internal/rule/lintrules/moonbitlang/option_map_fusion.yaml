id: option_map_fusion
description: |
  Adjacent standard-library Option.map calls can share one map.
  Use value.map(x => second(first(x))), retaining the original callbacks.
  The checks preserve callback evaluation, call order, and checked errors.
semantic:
  check: option-map-fusion
  patterns:
    - shape: $(value:exp).map($(first:exp)).map($(second:exp))
