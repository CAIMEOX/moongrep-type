id: array_map_fusion
description: |
  Adjacent standard-library Array.map calls have composable callback types.
  Consider xs.map(x => f(g(x))) in place of xs.map(g).map(f).
  Review required: prove callbacks pure and total, preserve callback-expression
  evaluation, and use fresh bindings. Eager fusion changes side-effect order.
semantic:
  check: array-map-fusion
  patterns:
    - shape: $(source:exp).map($(first:exp)).map($(second:exp))
